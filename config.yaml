# Global settings applied to every benchmark run
global:
  warmup_iterations: 3        # Non-measured queries before benchmark
  benchmark_iterations: 10    # Measured iterations per test function
  results_dir: "results"      # Output directory for JSON / CSV reports
  stats_interval_sec: 0.5     # Docker stats polling interval

# Engine definitions
engines:
  postgres:
    engine_type: postgres
    image: "postgres:16-alpine"
    port: 5432
    host_port: 5433
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: benchdb
    healthcheck:
      test: "pg_isready -U bench"
      interval: 2
      retries: 15
    resources:
      mem_limit: "512m"
      cpus: 1.0

  mongodb:
    engine_type: mongodb
    image: "mongo:7"
    port: 27017
    host_port: 27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: bench
      MONGO_INITDB_ROOT_PASSWORD: bench
      MONGO_INITDB_DATABASE: benchdb
    healthcheck:
      test: "mongosh --eval 'db.runCommand({ping:1})' --quiet"
      interval: 2
      retries: 15
    resources:
      mem_limit: "512m"
      cpus: 1.0

  mysql:
    engine_type: mysql
    image: "mysql:8"
    port: 3306
    host_port: 3306
    environment:
      MYSQL_ROOT_PASSWORD: bench
      MYSQL_USER: bench
      MYSQL_PASSWORD: bench
      MYSQL_DATABASE: benchdb
    healthcheck:
      test: "mysqladmin ping -h localhost -uroot -pbench"
      interval: 2
      retries: 15
      start_period_sec: 5
    resources:
      mem_limit: "512m"
      cpus: 1.0

  couchdb:
    engine_type: couchdb
    image: "couchdb:3"
    port: 5984
    host_port: 5984
    environment:
      COUCHDB_USER: bench
      COUCHDB_PASSWORD: bench
    healthcheck:
      test: "curl -v http://127.0.0.1:5984/_up"
      interval: 2
      retries: 15
      start_period_sec: 5
    resources:
      mem_limit: "512m"
      cpus: 1.0
